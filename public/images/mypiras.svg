<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" role="img" aria-label="MyPiras ERP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#071022"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="700" height="500" fill="url(#bg)"/>
  <circle cx="120" cy="90" r="200" fill="url(#blobA)"/>
  <circle cx="600" cy="430" r="220" fill="url(#blobB)"/>

  <!-- glass dashboard card -->
  <g>
    <rect x="80" y="150" width="540" height="250" rx="24"
          fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>

    <!-- mini chart bars -->
    <g>
      <rect x="112" y="300" width="26" height="70" rx="6" fill="url(#accent)" opacity="0.9"/>
      <rect x="150" y="270" width="26" height="100" rx="6" fill="url(#accent)" opacity="0.75"/>
      <rect x="188" y="240" width="26" height="130" rx="6" fill="url(#accent)" opacity="0.9"/>
      <rect x="226" y="290" width="26" height="80" rx="6" fill="url(#accent)" opacity="0.65"/>
    </g>

    <!-- stat pills -->
    <g fill="#ffffff" fill-opacity="0.08">
      <rect x="300" y="240" width="290" height="20" rx="10"/>
      <rect x="300" y="272" width="230" height="20" rx="10"/>
      <rect x="300" y="304" width="260" height="20" rx="10"/>
      <rect x="300" y="336" width="180" height="20" rx="10"/>
    </g>
  </g>

  <!-- title -->
  <text x="80" y="98" font-family="Inter, system-ui, Segoe UI, Arial, sans-serif"
        font-size="46" font-weight="800" fill="#ffffff">MyPiras</text>
  <text x="278" y="98" font-family="Inter, system-ui, Segoe UI, Arial, sans-serif"
        font-size="46" font-weight="800" fill="url(#accent)">ERP</text>
  <text x="82" y="128" font-family="Inter, system-ui, Segoe UI, Arial, sans-serif"
        font-size="18" font-weight="500" fill="#ffffff" fill-opacity="0.7"
        letter-spacing="3">B2B · B2C · NEXT.JS</text>
</svg>
